# Builds a debug Krita APK for arm64-v8a Android devices.
#
# This mirrors the android-build-arm64-v8a job from
# build-tools/ci-scripts/android.yml, but runs on GitHub-hosted runners.
# The prebuilt dependencies (Qt, KF5, etc.) are downloaded from KDE's
# public package registry on invent.kde.org, so only Krita itself is
# compiled here.

name: Android APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-b6ab54c4-e7bedv

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # KDE's Android VM image is based on Ubuntu 22.04; the host tools in the
    # prebuilt dependencies (moc, rcc, androiddeployqt...) are built for it
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      ANDROID_PLATFORM_VERSION: android-36
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0

      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
      KDECI_SKIP_ECM_ANDROID_TOOLCHAIN: "True"
      KDECI_ANDROID_ABI: arm64-v8a
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-android-arm64-v8a
      KDECI_EXTRA_CMAKE_ARGS: -DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF
      KRITACI_ANDROID_PACKAGE_TYPE: debug
      KRITACI_ARCHIVE_ARTIFACTS: "False"
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: "True"
      DEPS_BRANCH_NAME_ANDROID: master
      DEPS_REPO_BRANCH_NAME_ANDROID: master

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Prepare work directories
        run: |
          # /mnt usually has more free space than the root partition
          sudo mkdir -p /mnt/wd /mnt/cache /mnt/ccache
          sudo chown -R "$USER" /mnt/wd /mnt/cache /mnt/ccache
          echo "KDECI_WORKDIR_PATH=/mnt/wd" >> "$GITHUB_ENV"
          echo "KDECI_CACHE_PATH=/mnt/cache" >> "$GITHUB_ENV"
          echo "KDECI_CC_CACHE=/mnt/ccache" >> "$GITHUB_ENV"
          df -h /mnt

      - name: Create tools directory
        run: mkdir -p tools

      - name: Checkout Krita
        uses: actions/checkout@v4
        with:
          path: krita
          fetch-depth: 1

      - name: Install host packages
        run: |
          # The host tools in KDE's prebuilt deps (qmlimportscanner etc.) are
          # built with GCC 13+ and rely on the libstdc++ shipped with it to
          # initialize std::cout; with Ubuntu 22.04's stock libstdc++ they
          # segfault on the first write, so pull a newer one from the
          # toolchain PPA
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --only-upgrade libstdc++6
          strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep -E '^GLIBCXX_3\.4\.3[0-9]$' | tail -1
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache gettext python3-venv python3-dev \
            build-essential pkg-config patchelf unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "KDECI_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KDECI_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      # NOTE: the tooling and the Python venv are kept *outside* of the
      # source tree: androiddeployqt runs qmlimportscanner over the whole
      # source directory, and it crashes on the symlinks inside a venv
      - name: Fetch KDE CI tooling
        working-directory: tools
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b "$DEPS_REPO_BRANCH_NAME_ANDROID" --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1
          echo "KDECI_REPO_METADATA_PATH=$PWD/krita-deps-management/repo-metadata" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$PWD/krita-deps-management/tools/android-toolchain-krita.cmake" >> "$GITHUB_ENV"
          echo "DEPS_TOOLS=$PWD/krita-deps-management" >> "$GITHUB_ENV"

      - name: Set up Python environment
        working-directory: tools
        run: |
          python3 -m venv venv --upgrade-deps
          . venv/bin/activate
          pip install -r krita-deps-management/requirements.txt
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ccache-android-arm64-${{ github.run_id }}
          restore-keys: ccache-android-arm64-

      - name: Download dependencies and build Krita
        working-directory: krita
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -u "$DEPS_TOOLS/tools/replace-branch-in-seed-file.py" \
            "$DEPS_TOOLS/latest/krita-deps.yml" -p -o ../tools/branch-corrected-deps.yml -d "$DEPS_BRANCH_NAME_ANDROID"
          python3 -u "$DEPS_TOOLS/tools/generate-deps-file.py" -s ../tools/branch-corrected-deps.yml -o .kde-ci.yml
          python3 -u "$DEPS_TOOLS/ci-utilities/run-ci-build.py" \
            --project krita --branch master \
            --platform Android/arm64-v8a/Qt5/Shared \
            --only-build --skip-publishing 2>&1 | tee ../tools/build-krita.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ccache-android-arm64-${{ github.run_id }}

      # Debug APKs are signed with ~/.android/debug.keystore, which would
      # otherwise be generated anew on every runner. A different signature
      # means Android refuses to install the new APK over the old one, so
      # always sign with the same (test-only) key from the repository.
      - name: Install fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp krita/.github/ci/debug.keystore ~/.android/debug.keystore

      - name: Package APK
        working-directory: krita
        run: |
          set -o pipefail
          if ! python3 -u build-tools/ci-scripts/build-android-package.py 2>&1 | tee ../tools/build-apk.log; then
            echo "::group::qmlimportscanner diagnostics"
            cd /mnt/wd/krita/_build
            cat krita-deployment.json || true
            SCANNER=$(find /mnt/wd/krita/_install -name qmlimportscanner -type f | head -1)
            echo "scanner: $SCANNER"
            ROOT=$(python3 -c "import json;print(json.load(open('krita-deployment.json'))['qml-root-path'])")
            IMPORTS=$(python3 -c "import json;print(json.load(open('krita-deployment.json')).get('qml-import-paths','').replace(',',' '))")
            IMPORT_ARGS=""
            for p in $IMPORTS; do IMPORT_ARGS="$IMPORT_ARGS -importPath $p"; done
            find "$ROOT" -type l | head -20
            sudo apt-get install -y --no-install-recommends gdb > /dev/null
            gdb -batch -ex run -ex bt --args "$SCANNER" -rootPath "$ROOT" $IMPORT_ARGS 2>&1 | tail -80
            echo "::endgroup::"
            exit 1
          fi
          ls -la /mnt/wd/krita/_packaging

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krita-arm64-v8a-debug-apk
          path: /mnt/wd/krita/_packaging/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            tools/*.log
          if-no-files-found: ignore

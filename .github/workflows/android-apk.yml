# Builds a debug Krita APK for arm64-v8a Android devices.
#
# This mirrors the android-build-arm64-v8a job from
# build-tools/ci-scripts/android.yml, but runs on GitHub-hosted runners.
# The prebuilt dependencies (Qt, KF5, etc.) are downloaded from KDE's
# public package registry on invent.kde.org, so only Krita itself is
# compiled here.

name: Android APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-b6ab54c4-e7bedv

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # KDE's Android VM image is based on Ubuntu 22.04; the host tools in the
    # prebuilt dependencies (moc, rcc, androiddeployqt...) are built for it
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      ANDROID_PLATFORM_VERSION: android-36
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0

      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
      KDECI_SKIP_ECM_ANDROID_TOOLCHAIN: "True"
      KDECI_ANDROID_ABI: arm64-v8a
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-android-arm64-v8a
      KDECI_EXTRA_CMAKE_ARGS: -DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF
      KRITACI_ANDROID_PACKAGE_TYPE: debug
      KRITACI_ARCHIVE_ARTIFACTS: "False"
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: "True"
      DEPS_BRANCH_NAME_ANDROID: master
      DEPS_REPO_BRANCH_NAME_ANDROID: master

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Prepare work directories
        run: |
          # /mnt usually has more free space than the root partition
          sudo mkdir -p /mnt/wd /mnt/cache /mnt/ccache
          sudo chown -R "$USER" /mnt/wd /mnt/cache /mnt/ccache
          echo "KDECI_WORKDIR_PATH=/mnt/wd" >> "$GITHUB_ENV"
          echo "KDECI_CACHE_PATH=/mnt/cache" >> "$GITHUB_ENV"
          echo "KDECI_CC_CACHE=/mnt/ccache" >> "$GITHUB_ENV"
          df -h /mnt

      - name: Checkout Krita
        uses: actions/checkout@v4
        with:
          path: krita
          fetch-depth: 1

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache gettext python3-venv python3-dev \
            build-essential pkg-config patchelf unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "KDECI_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KDECI_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: Fetch KDE CI tooling
        working-directory: krita
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b "$DEPS_REPO_BRANCH_NAME_ANDROID" --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1
          echo "KDECI_REPO_METADATA_PATH=$GITHUB_WORKSPACE/krita/krita-deps-management/repo-metadata" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/krita/krita-deps-management/tools/android-toolchain-krita.cmake" >> "$GITHUB_ENV"

      - name: Set up Python environment
        working-directory: krita
        run: |
          python3 -m venv venv --upgrade-deps
          . venv/bin/activate
          pip install -r krita-deps-management/requirements.txt
          echo "$GITHUB_WORKSPACE/krita/venv/bin" >> "$GITHUB_PATH"

      - name: Download dependencies and build Krita
        working-directory: krita
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py \
            krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d "$DEPS_BRANCH_NAME_ANDROID"
          python3 -u krita-deps-management/tools/generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py \
            --project krita --branch master \
            --platform Android/arm64-v8a/Qt5/Shared \
            --only-build --skip-publishing 2>&1 | tee build-krita.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package APK
        working-directory: krita
        run: |
          python3 -u build-tools/ci-scripts/build-android-package.py 2>&1 | tee build-apk.log
          test "${PIPESTATUS[0]}" -eq 0
          ls -la /mnt/wd/krita/_packaging

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krita-arm64-v8a-debug-apk
          path: /mnt/wd/krita/_packaging/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            krita/*.log
          if-no-files-found: ignore
